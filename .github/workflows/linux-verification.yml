name: Linux verification

on:
  push:
    branches: [feature/kalman-improvements]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          uname -a
          g++ --version
          python3 --version
      - name: Build Linux programs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kalman-build"
          for category in File_IO Process Memory IPC Permissions Kalman_Filter; do
            g++ -std=c++17 -O2 "Linux/$category/${category}_Linux.cpp" -o "$RUNNER_TEMP/kalman-build/$category"
          done
      - name: Test output verification
        run: python3 -B -m unittest discover -s tests -v
      - name: Test 3D EKF mathematics
        run: |
          g++ -std=c++17 -O2 tests/test_ekf3d.cpp -o "$RUNNER_TEMP/kalman-build/test_ekf3d"
          "$RUNNER_TEMP/kalman-build/test_ekf3d"
          g++ -std=c++17 -O2 common/run_ekf3d.cpp -o "$RUNNER_TEMP/kalman-build/run_ekf3d"
          python3 -B common/generate_3d_scenario.py --output-dir "$RUNNER_TEMP/ekf3d-scenario"
          "$RUNNER_TEMP/kalman-build/run_ekf3d" "$RUNNER_TEMP/ekf3d-scenario/measurements.csv" "$RUNNER_TEMP/ekf3d-estimates.csv"
          python3 -B common/evaluate_3d_scenario.py "$RUNNER_TEMP/ekf3d-scenario" "$RUNNER_TEMP/ekf3d-estimates.csv"
          python3 -B tests/check_ekf3d_multiseed.py "$RUNNER_TEMP/kalman-build/run_ekf3d"
          python3 -B tests/check_ekf3d_reference.py "$RUNNER_TEMP/kalman-build/run_ekf3d"
      - name: Test sequential IMM extension
        run: |
          g++ -std=c++17 -O2 tests/test_imm3d.cpp -o "$RUNNER_TEMP/kalman-build/test_imm3d"
          "$RUNNER_TEMP/kalman-build/test_imm3d"
          g++ -std=c++17 -O2 common/run_imm3d.cpp -o "$RUNNER_TEMP/kalman-build/run_imm3d"
          "$RUNNER_TEMP/kalman-build/run_imm3d" "$RUNNER_TEMP/ekf3d-scenario/measurements.csv" "$RUNNER_TEMP/imm3d-estimates.csv"
          python3 -B common/evaluate_3d_scenario.py "$RUNNER_TEMP/ekf3d-scenario" "$RUNNER_TEMP/imm3d-estimates.csv"
          python3 -B common/compare_imm3d.py --scenario "$RUNNER_TEMP/ekf3d-scenario" --ekf "$RUNNER_TEMP/kalman-build/run_ekf3d" --imm "$RUNNER_TEMP/kalman-build/run_imm3d" --output-dir "$RUNNER_TEMP/imm3d-comparison" --iterations 1 --notes "CI smoke test; not controlled performance evidence"
      - name: Test native parallel 3D EKF
        run: |
          g++ -std=c++17 -O2 Linux/Kalman_Filter/EKF3D_Linux.cpp -o "$RUNNER_TEMP/kalman-build/EKF3D_Linux"
          python3 -B tests/check_ekf3d_parallel.py "$RUNNER_TEMP/kalman-build/run_ekf3d" "$RUNNER_TEMP/kalman-build/EKF3D_Linux"
          g++ -std=c++17 -O2 -DEKF3D_TEST_FAILURES Linux/Kalman_Filter/EKF3D_Linux.cpp -o "$RUNNER_TEMP/kalman-build/EKF3D_Linux_faults"
          python3 -B tests/check_ekf3d_faults.py "$RUNNER_TEMP/kalman-build/EKF3D_Linux_faults"
          python3 -B common/benchmark_ekf3d.py --sequential "$RUNNER_TEMP/kalman-build/run_ekf3d" --parallel "$RUNNER_TEMP/kalman-build/EKF3D_Linux" --input "$RUNNER_TEMP/ekf3d-scenario/measurements.csv" --output-dir "$RUNNER_TEMP/ekf3d-benchmark" --build-command "g++ -std=c++17 -O2" --iterations 1 --warmups 0 --notes "CI smoke test; not controlled performance evidence"
          python3 -B tests/check_ekf3d_benchmark.py "$RUNNER_TEMP/ekf3d-benchmark"
          python3 -B common/benchmark_ekf3d.py --sequential "$RUNNER_TEMP/kalman-build/run_ekf3d" --parallel "$RUNNER_TEMP/kalman-build/EKF3D_Linux" --input "$RUNNER_TEMP/ekf3d-scenario/measurements.csv" --output-dir "$RUNNER_TEMP/ekf3d-matrix" --build-command "g++ -std=c++17 -O2" --iterations 1 --warmups 0 --track-counts 1 3 --batch-sizes 32 512 --notes "CI matrix smoke test; not controlled performance evidence"
          python3 -c "import csv,os; p=os.environ['RUNNER_TEMP']+'/ekf3d-matrix/samples.csv'; r=list(csv.DictReader(open(p))); assert len(r)==48 and {int(x['batch_size']) for x in r}=={32,512} and {int(x['requested_tracks']) for x in r}=={1,3}"
      - name: Test filter failure paths
        run: |
          g++ -std=c++17 -O2 -DKALMAN_TEST_FAILURES Linux/Kalman_Filter/Kalman_Filter_Linux.cpp -o "$RUNNER_TEMP/kalman-build/Kalman_Filter_faults"
          python3 -B tests/check_filter_failures.py "$RUNNER_TEMP/kalman-build/Kalman_Filter_faults" common/sensor_data.csv Linux --test-worker-failure
      - name: Run and verify integrated filter
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/kalman-run"
          mkdir -p "$run_dir/common" "$run_dir/logs" "$run_dir/results/Linux" "$run_dir/Linux/Kalman_Filter"
          cp common/sensor_data.csv "$run_dir/common/sensor_data.csv"
          cd "$run_dir"
          "$RUNNER_TEMP/kalman-build/Kalman_Filter"
          python3 "$GITHUB_WORKSPACE/common/verify_part_b.py" --input "$run_dir/common/sensor_data.csv" --output "$run_dir/results/Linux/filtered_sensor_data.csv"
          python3 "$GITHUB_WORKSPACE/tests/check_benchmark_samples.py" "$run_dir/results/Linux"
      - name: Check isolated experiment runner
        run: |
          python3 common/run_filter_experiment.py --binary "$RUNNER_TEMP/kalman-build/Kalman_Filter" --input common/sensor_data.csv --output-dir "$RUNNER_TEMP/kalman-experiment" --build-command "g++ -std=c++17 -O2" --notes "GitHub-hosted CI; not controlled performance evidence"
          python3 tests/check_benchmark_samples.py "$RUNNER_TEMP/kalman-experiment/results/Linux"
      - name: Preserve Linux experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-filter-experiment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kalman-experiment/manifest.json
            ${{ runner.temp }}/kalman-experiment/execution.log
            ${{ runner.temp }}/kalman-experiment/results/Linux/persistent_samples.csv
            ${{ runner.temp }}/kalman-experiment/results/Linux/persistent_summary.csv
          if-no-files-found: error
          retention-days: 14
      - name: Preserve 3D benchmark smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-3d-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ekf3d-benchmark/manifest.json
            ${{ runner.temp }}/ekf3d-benchmark/samples.csv
            ${{ runner.temp }}/ekf3d-benchmark/summary.csv
            ${{ runner.temp }}/ekf3d-matrix/manifest.json
            ${{ runner.temp }}/ekf3d-matrix/samples.csv
            ${{ runner.temp }}/ekf3d-matrix/summary.csv
          if-no-files-found: error
          retention-days: 14
