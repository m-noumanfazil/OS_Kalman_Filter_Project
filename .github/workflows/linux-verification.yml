name: Linux verification

on:
  push:
    branches: [feature/kalman-improvements]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          uname -a
          g++ --version
          python3 --version
      - name: Build Linux programs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kalman-build"
          for category in File_IO Process Memory IPC Permissions Kalman_Filter; do
            g++ -std=c++17 -O2 "Linux/$category/${category}_Linux.cpp" -o "$RUNNER_TEMP/kalman-build/$category"
          done
      - name: Test output verification
        run: python3 -B -m unittest discover -s tests -v
      - name: Test filter failure paths
        run: python3 -B tests/check_filter_failures.py "$RUNNER_TEMP/kalman-build/Kalman_Filter" common/sensor_data.csv Linux
      - name: Run and verify integrated filter
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/kalman-run"
          mkdir -p "$run_dir/common" "$run_dir/logs" "$run_dir/results/Linux" "$run_dir/Linux/Kalman_Filter"
          cp common/sensor_data.csv "$run_dir/common/sensor_data.csv"
          cd "$run_dir"
          "$RUNNER_TEMP/kalman-build/Kalman_Filter"
          python3 "$GITHUB_WORKSPACE/common/verify_part_b.py" --input "$run_dir/common/sensor_data.csv" --output "$run_dir/results/Linux/filtered_sensor_data.csv"
          python3 "$GITHUB_WORKSPACE/tests/check_benchmark_samples.py" "$run_dir/results/Linux"
      - name: Check isolated experiment runner
        run: |
          python3 common/run_filter_experiment.py --binary "$RUNNER_TEMP/kalman-build/Kalman_Filter" --input common/sensor_data.csv --output-dir "$RUNNER_TEMP/kalman-experiment" --build-command "g++ -std=c++17 -O2" --notes "GitHub-hosted CI; not controlled performance evidence"
          python3 tests/check_benchmark_samples.py "$RUNNER_TEMP/kalman-experiment/results/Linux"
